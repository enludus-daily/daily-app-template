name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: enludus-daily/daily-actions/.github/workflows/ios-ci.yml@1468efb28b9e331f0a64d0903e2ed5baeecd71c3 # daily-actions 2026-11-03
    with:
      actions-sha: 1468efb28b9e331f0a64d0903e2ed5baeecd71c3
      scheme: DailyApp
      guard-disabled: ${{ vars.DAILY_GUARD_DISABLED == 'true' && 'true' || 'false' }}
