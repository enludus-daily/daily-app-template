name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: enludus-daily/daily-actions/.github/workflows/ios-ci.yml@610dc0070c3402b161e2d4bc843ed1179b8a91d1 # daily-actions 2026-11-11-demo-display
    with:
      actions-sha: 610dc0070c3402b161e2d4bc843ed1179b8a91d1
      scheme: DailyApp
      # iPhone Duo の全画面の表示には Xcode 27.1（iOS 27.1 SDK）が要る（Apple Tech Talk「Prepare your app for iPhone Duo」）。
      # xcode-27 ランナーは GitHub で Preview 扱い（actions/runner-images #14404）。
      runs-on: xcode-27
      xcode-version: "27.1"
      test-destination: "platform=iOS Simulator,name=iPhone Duo,OS=27.1"
      screenshot-device: iPhone Duo
      # 撮る画面（アプリが起動引数 -screenshotScene <名前> で開く画面。@dark でダークモード）。手順書 9.5
      screenshot-scenes: launch launch@en
      # YouTube の「AI が毎日アプリを作る」シリーズ用：起動引数 -demo の再生を英語で録る（artifact demo-video）。手順書 7〜9
      demo-video: en
      guard-disabled: ${{ vars.DAILY_GUARD_DISABLED == 'true' && 'true' || 'false' }}
