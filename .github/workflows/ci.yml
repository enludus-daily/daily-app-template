name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: enludus-daily/daily-actions/.github/workflows/ios-ci.yml@e23391162260978caef6fa1025d92e249965c5ca # daily-actions 2026-11-03-owner-author
    with:
      actions-sha: e23391162260978caef6fa1025d92e249965c5ca
      scheme: DailyApp
      guard-disabled: ${{ vars.DAILY_GUARD_DISABLED == 'true' && 'true' || 'false' }}
