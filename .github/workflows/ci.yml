name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: enludus-daily/daily-actions/.github/workflows/ios-ci.yml@b98f50c8e3b71f7123eef34d11e7faeafe028316 # daily-actions 2026-11-04-asc
    with:
      actions-sha: b98f50c8e3b71f7123eef34d11e7faeafe028316
      scheme: DailyApp
      # iPhone Duo の全画面の表示には Xcode 27.1（iOS 27.1 SDK）が要る（Apple Tech Talk「Prepare your app for iPhone Duo」）。
      # xcode-27 ランナーは GitHub で Preview 扱い（actions/runner-images #14404）。
      runs-on: xcode-27
      xcode-version: "27.1"
      test-destination: "platform=iOS Simulator,name=iPhone Duo,OS=27.1"
      screenshot-device: iPhone Duo
      guard-disabled: ${{ vars.DAILY_GUARD_DISABLED == 'true' && 'true' || 'false' }}
