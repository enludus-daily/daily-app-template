# workflow_dispatch だけ（pull_request から秘密に届かないようにする）。テンプレート自身では動かさない。
name: TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  testflight:
    if: github.repository != 'enludus-daily/daily-app-template'
    uses: enludus-daily/daily-actions/.github/workflows/ios-testflight.yml@7a29c2406ad0198b2043120a18c0cff1384fe654 # daily-actions 2026-11-03-duo-screenshots
    with:
      actions-sha: 7a29c2406ad0198b2043120a18c0cff1384fe654
      scheme: DailyApp
      # iPhone Duo の全画面の表示には Xcode 27.1（iOS 27.1 SDK）が要る（Apple Tech Talk「Prepare your app for iPhone Duo」）。
      # xcode-27 ランナーは GitHub で Preview 扱い（actions/runner-images #14404）。
      runs-on: xcode-27
      xcode-version: "27.1"
      team-id: ${{ vars.APPLE_TEAM_ID }}
      guard-disabled: ${{ vars.DAILY_GUARD_DISABLED == 'true' && 'true' || 'false' }}
    secrets:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_P8: ${{ secrets.ASC_P8 }}
