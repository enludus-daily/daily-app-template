# workflow_dispatch だけ（pull_request から秘密に届かないようにする）。テンプレート自身では動かさない。
name: TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  testflight:
    if: github.repository != 'enludus-daily/daily-app-template'
    uses: enludus-daily/daily-actions/.github/workflows/ios-testflight.yml@e23391162260978caef6fa1025d92e249965c5ca # daily-actions 2026-11-03-owner-author
    with:
      actions-sha: e23391162260978caef6fa1025d92e249965c5ca
      scheme: DailyApp
      team-id: ${{ vars.APPLE_TEAM_ID }}
      guard-disabled: ${{ vars.DAILY_GUARD_DISABLED == 'true' && 'true' || 'false' }}
    secrets:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_P8: ${{ secrets.ASC_P8 }}
