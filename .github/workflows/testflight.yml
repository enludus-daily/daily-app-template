# workflow_dispatch だけ（pull_request から秘密に届かないようにする）。テンプレート自身では動かさない。
name: TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  testflight:
    if: github.repository != 'enludus-daily/daily-app-template'
    uses: enludus-daily/daily-actions/.github/workflows/ios-testflight.yml@1468efb28b9e331f0a64d0903e2ed5baeecd71c3 # daily-actions 2026-11-03
    with:
      actions-sha: 1468efb28b9e331f0a64d0903e2ed5baeecd71c3
      scheme: DailyApp
      team-id: ${{ vars.APPLE_TEAM_ID }}
      guard-disabled: ${{ vars.DAILY_GUARD_DISABLED == 'true' && 'true' || 'false' }}
    secrets:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_P8: ${{ secrets.ASC_P8 }}
